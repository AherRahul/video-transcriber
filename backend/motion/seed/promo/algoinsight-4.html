<style>
/* the mentor and the planner, then where to start */
.abs { position: absolute; }
.side { top: 300px; min-height: 240px; width: 600px; padding: 28px 34px; }
.mentor { left: 160px; }
.planner { left: 840px; }
.top { display: flex; align-items: center; gap: 22px; }
.top .p-badge { flex: none; }
.side .p-card-title { font-size: 40px; }
.side .p-card-text { margin-top: 18px; }
.week { margin-top: 22px; display: flex; gap: 12px; }
.box { position: relative; width: 62px; height: 62px; border: 4px solid var(--ink); border-radius: 12px; background: #fff; overflow: hidden; }
.box .f { position: absolute; inset: 0; background: var(--c-mint); }
.cta { left: 0; right: 0; top: 410px; display: flex; justify-content: center; align-items: center; gap: 40px; }
.cta .p-head { font-size: 96px; }
</style>
<div class="abs p-card sky side mentor" data-id="card-mentor">
  <div class="top"><div class="p-badge"><svg viewBox="0 0 48 48"><path d="M8 12 h32 v20 h-18 l-8 7 v-7 h-6 z"/></svg></div><div class="p-card-title">AI mentor</div></div>
  <div class="p-card-text">knows your courses and scores</div>
</div>
<div class="abs p-card lemon side planner" data-id="card-planner">
  <div class="top"><div class="p-badge"><svg viewBox="0 0 48 48"><path d="M8 12 h32 v28 h-32 z M8 20 h32 M16 8 v8 M32 8 v8"/></svg></div><div class="p-card-title">Prep planner</div></div>
  <div class="week" data-id="week"><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div><div class="box"><div class="f"></div></div></div>
</div>
<div class="abs cta">
  <span class="p-tag" data-id="tag-free">Start free</span>
  <h1 class="p-head" data-id="url"><span class="p-marked">algoinsight.io</span></h1>
</div>
<script>
const days = $$('.box .f');
tl.set(days, { scaleY: 0, transformOrigin: '50% 100%' }, 0);
fx.pop($('card-mentor'), cue(1));
fx.pop($('card-planner'), cue(2));
tl.to(days, { scaleY: 1, duration: 0.22, ease: 'power2.out', stagger: 0.18 }, cue(2, 0.6));
fx.exit([$('card-mentor'), $('card-planner')], cue(3, -0.3));
fx.tearOn($('tag-free'), cue(3));
fx.rise($('url'), cue(3, 0.15));
fx.marker($('url').querySelector('.p-marked'), cue(3, 0.6));
</script>
